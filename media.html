<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Audio</h3>
    <audio controls loop>
        <source src="audio.mp3"audio/mpeg">
    </audio>

    <h3>Video</h3>
    <video width="700" controls>
        <source src="scenery video.mp4"

    </video>

<picture>
        <source media="(max-width:600px)"
                    srcset="klulogo.png">
        <source
            media="(min-width: 601px)"
            srcset="klulogo.png">
        
        <img src="klulogo.png"
                alt="Responsive Nature"
                width="300">
     </picture>
</body>
</html>
